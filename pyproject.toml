[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-harness"
dynamic = ["version"]
description = "Standalone agent harness (Claude Code-compatible config) driving OpenRouter/Databricks models; includes the claude-bridge proxy. Continues rolo-claude 1.0.1 under a new name."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual==8.2.8",
    "rich>=14,<16",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "textual-dev",
]
# H8 scope B: halo_harness/tools/imageutil.py works with NO imaging library
# at all (an over-limit image is simply omitted with a note) -- installing
# Pillow lets it actually resize/downscale one instead. Never required.
vision = [
    "Pillow>=10",
]
# H13 Part B: halo_harness/tui/images.py's kitty encoder needs no imaging
# library at all (kitty decodes the PNG/JPEG bytes itself, f=100); Pillow
# is what lets the sixel encoder do real pixel/palette work and lets both
# protocols downscale to a bounded on-screen size. `textual-image` (PyPI)
# was evaluated and rejected: its own repo declares LGPL-3.0 (not
# permissive) and it requires Python >=3.12 (this project supports >=3.10).
images = [
    "Pillow>=10",
]

[project.scripts]
# 2.0.1: this distribution ships EXACTLY ONE executable. The 2.0.0 comment
# here used to say `rolo-claude` would keep working "forever" as a second,
# installed console-script alias -- superseded by the owner's own first
# real install attempt on a work VM: an old, separately-installed
# `rolo-claude` tool already owned that name, so `uv tool install
# --editable .` of Halo failed outright ("Executable already exists:
# rolo-claude (use --force to overwrite)") and `halo` never got installed
# at all. See CHANGELOG [2.0.1]. `rolo-claude` keeps working as a
# deprecated, UNINSTALLED alias two other ways instead: `bin/rolo-claude`
# (run straight from a checkout, never registered here) and
# `cli.main_deprecated_alias` (kept in the source for that script/any
# future reuse, just no longer wired to a pyproject entry point).
halo = "halo_harness.cli:main"

[tool.setuptools]
py-modules = ["bridge"]

[tool.setuptools.packages.find]
include = ["halo_harness*"]

[tool.setuptools.package-data]
# U2: tui/styles.tcss must ship with a non-editable install too (App's
# CSS_PATH resolves relative to tui/app.py at runtime). H8 scope C: the
# per-model data table and the vendored catalog fallbacks are read from
# disk at runtime (providers/profiles.py, model.py) -- without listing
# them here a non-editable `pip install .`/wheel build would silently
# drop every *.json under providers/, same class of bug package-data
# already exists to prevent for styles.tcss.
halo_harness = ["tui/*.tcss", "providers/*.json", "providers/catalog/*.json"]

[tool.setuptools.dynamic]
version = { attr = "halo_harness.__version__" }
