[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolo-claude"
dynamic = ["version"]
description = "Standalone agent harness (Claude Code-compatible config) driving OpenRouter/Databricks models; includes the claude-bridge proxy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual==8.2.8",
    "rich>=14,<16",
    "mcp>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "textual-dev",
]

[project.scripts]
rolo-claude = "rolo_claude.cli:main"

[tool.setuptools]
py-modules = ["bridge"]

[tool.setuptools.packages.find]
include = ["rolo_claude*"]

[tool.setuptools.dynamic]
version = { attr = "rolo_claude.__version__" }
